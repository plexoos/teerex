[project]
name = "teerex"
version = "0.1.0"
description = ""
authors = [ { name = "Dmitri Smirnov", email = "dmixsmi@gmail.com" } ]
requires-python = ">=3.11"
dependencies = [
    "jq>=1.11.0",
    "marimo>=0.24.0",
    "matplotlib>=3.10.9",
    "numpy>=2.0.0",
    "pandas>=3.0",
    "scipy>=1.15",
    "pip>=26.1.1",
    "ray>=2.55.1",
    "torch>=2.13.0",
]

[project.scripts]
simload = "teerex.simload:main"
simload-ray = "teerex.simload_ray:main"
study = "teerex.study:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["teerex"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
